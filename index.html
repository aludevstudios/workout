<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100-Day Bilateral Workout Stack</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --phase-tag: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem 1rem;
    }

    header { text-align: center; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }

    .primer-btn {
      margin-top: 0.5rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: #fbbf24;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .primer-btn:hover { background: rgba(245, 158, 11, 0.25); }

    .canvas-container { position: relative; margin: 0.5rem 0 1rem 0; }
    canvas { display: block; background: transparent; }

    .stack-wrapper { position: relative; width: 100%; max-width: 480px; }
    .stack-layer {
      position: absolute; left: 0; right: 0; height: 100%; border-radius: 1.25rem;
      background-color: #141f33; border: 1px solid #233148; transition: all 0.3s ease; z-index: 1;
    }
    .layer-2 { top: 12px; transform: scale(0.92); opacity: 0.4; }
    .layer-1 { top: 6px; transform: scale(0.96); opacity: 0.7; }

    .workout-card {
      position: relative; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 1.25rem; padding: 1.5rem; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.6);
      z-index: 2; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }
    .workout-card.cleared { transform: translateY(-40px) scale(0.95); opacity: 0; }

    .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .badges-left { display: flex; gap: 0.4rem; align-items: center; }
    .day-badge {
      background: var(--accent-glow); color: var(--accent); font-weight: 700; font-size: 0.85rem;
      padding: 0.25rem 0.65rem; border-radius: 9999px; border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .phase-badge {
      background: rgba(129, 140, 248, 0.15); color: var(--phase-tag); font-size: 0.75rem;
      font-weight: 600; padding: 0.25rem 0.55rem; border-radius: 9999px; border: 1px solid rgba(129, 140, 248, 0.3);
    }
    .rotation-tag { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .workout-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.25; }
    .workout-description { font-size: 0.88rem; color: var(--text-muted); font-style: italic; line-height: 1.45; margin-bottom: 1.2rem; }

    .exercise-list { list-style: none; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.65rem; }
    .exercise-item {
      padding: 0.75rem 0.85rem; border-radius: 0.65rem; background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .exercise-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem; }
    .exercise-title-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .exercise-name { font-size: 0.92rem; font-weight: 600; }
    
    .media-badge {
      font-size: 0.72rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      transition: background 0.2s, color 0.2s;
    }
    .media-badge:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #e0f2fe;
    }

    .exercise-protocol { color: var(--accent); font-weight: 700; font-size: 0.82rem; }
    .exercise-cue { font-size: 0.8rem; color: var(--text-muted); line-height: 1.35; }

    .action-btn {
      width: 100%; background: var(--success); color: #052e16; border: none; padding: 0.9rem 1.25rem;
      font-size: 1rem; font-weight: 700; border-radius: 0.75rem; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 0.5rem; transition: filter 0.2s, transform 0.1s;
    }
    .action-btn:hover { filter: brightness(1.1); }
    .action-btn:active { transform: scale(0.98); }

    .footer-controls { display: flex; justify-content: space-between; margin-top: 1.25rem; max-width: 480px; width: 100%; padding: 0 0.5rem; }
    .secondary-btn {
      background: transparent; border: 1px solid #334155; color: var(--text-muted); padding: 0.4rem 0.8rem;
      border-radius: 0.5rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .secondary-btn:hover { border-color: #64748b; color: var(--text-main); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; padding: 1rem; z-index: 100;
    }
    .modal-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 1rem; max-width: 460px;
      width: 100%; padding: 1.5rem; max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .primer-step { padding: 0.75rem; background: rgba(255, 255, 255, 0.03); border-radius: 0.5rem; margin-bottom: 0.6rem; }
    .primer-step-title { font-weight: 700; font-size: 0.9rem; color: #fbbf24; margin-bottom: 0.2rem; }
    .primer-step-desc { font-size: 0.82rem; color: var(--text-muted); }

    .all-done { text-align: center; padding: 2.5rem 1.5rem; }
  </style>
</head>
<body>

  <header>
    <h1>100-Day Bilateral Stack</h1>
    <button class="primer-btn" id="openPrimerBtn">⚡ 4-Min Pre-Game Primer (Soccer / Tennis)</button>
  </header>

  <div class="canvas-container">
    <canvas id="progressCanvas" width="240" height="115"></canvas>
  </div>

  <div class="stack-wrapper">
    <div class="stack-layer layer-2" id="layer2"></div>
    <div class="stack-layer layer-1" id="layer1"></div>
    <main class="workout-card" id="activeCard"></main>
  </div>

  <div class="footer-controls">
    <button class="secondary-btn" id="undoBtn">↩ Undo Last Clear</button>
    <button class="secondary-btn" id="resetBtn">↻ Reset All</button>
  </div>

  <!-- Primer Modal -->
  <div class="modal-overlay" id="primerModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 style="font-size:1.15rem; color:#fbbf24;">⚡ 4-Minute Pre-Game Primer</h2>
        <button class="modal-close" id="closePrimerBtn">&times;</button>
      </div>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
        Dynamic pre-match activation for soccer & tennis to prepare ankles, calves, and adductors.
      </p>
      <div id="primerContent"></div>
    </div>
  </div>

  <script src="workouts.js"></script>
  <script>
    const STORAGE_KEY = "bilateral_100_stack_state";

    function loadState() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try { return JSON.parse(data); } catch(e) {}
      }
      return { currentIndex: 0, clearedHistory: [] };
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let appState = loadState();

    const canvas = document.getElementById("progressCanvas");
    const ctx = canvas.getContext("2d");

    function renderCanvasProgress() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const total = window.WORKOUT_STACK.length;
      const current = appState.currentIndex;
      const percent = Math.min(100, Math.round((current / total) * 100));

      const cx = w / 2, cy = h - 15, radius = 70;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, Math.PI, 2 * Math.PI, false);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#1e293b";
      ctx.lineCap = "round";
      ctx.stroke();

      if (percent > 0) {
        const progressEnd = Math.PI + (Math.PI * (percent / 100));
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI, progressEnd, false);
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#38bdf8";
        ctx.lineCap = "round";
        ctx.stroke();
      }

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${percent}%`, cx, cy - 20);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px -apple-system, sans-serif";
      ctx.fillText(`${current} of ${total} Cleared`, cx, cy - 4);
    }

    const cardEl = document.getElementById("activeCard");
    const layer1 = document.getElementById("layer1");
    const layer2 = document.getElementById("layer2");

    function renderCard() {
      const idx = appState.currentIndex;
      const remaining = window.WORKOUT_STACK.length - idx;

      layer1.style.display = remaining > 1 ? "block" : "none";
      layer2.style.display = remaining > 2 ? "block" : "none";

      if (idx >= window.WORKOUT_STACK.length) {
        cardEl.innerHTML = `
          <div class="all-done">
            <h2 style="font-size:1.6rem; color:var(--success); margin-bottom:0.5rem;">🎉 100 Sessions Conquered!</h2>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1.5rem;">
              You have completed the entire 100-session bilateral mobility, snowboard specificity, and alpine endurance program!
            </p>
            <button class="action-btn" onclick="resetChallenge()">Restart Challenge</button>
          </div>
        `;
        renderCanvasProgress();
        return;
      }

      const workout = window.WORKOUT_STACK[idx];
      cardEl.className = "workout-card";

      const exercisesHTML = workout.exercises.map(ex => {
        const mediaBtn = ex.media ? `
          <a href="${ex.media.url}" target="_blank" rel="noopener noreferrer" class="media-badge">
            ${ex.media.label}
          </a>
        ` : '';

        return `
          <li class="exercise-item">
            <div class="exercise-header">
              <div class="exercise-title-row">
                <span class="exercise-name">${ex.name}</span>
                ${mediaBtn}
              </div>
              <span class="exercise-protocol">${ex.protocol}</span>
            </div>
            <div class="exercise-cue">${ex.cue}</div>
          </li>
        `;
      }).join("");

      cardEl.innerHTML = `
        <div class="card-meta">
          <div class="badges-left">
            <span class="day-badge">Session ${workout.day} / 100</span>
            <span class="phase-badge">${workout.phase}</span>
          </div>
          <span class="rotation-tag">${workout.rotationCode}</span>
        </div>
        <h2 class="workout-title">${workout.title}</h2>
        <p class="workout-description">${workout.description}</p>
        <ul class="exercise-list">
          ${exercisesHTML}
        </ul>
        <button class="action-btn" id="clearBtn">
          ✓ Clear Session ${workout.day} & Next
        </button>
      `;

      document.getElementById("clearBtn").addEventListener("click", clearCurrentWorkout);
      renderCanvasProgress();
    }

    function clearCurrentWorkout() {
      cardEl.classList.add("cleared");

      setTimeout(() => {
        appState.clearedHistory.push({
          day: window.WORKOUT_STACK[appState.currentIndex].day,
          rotation: window.WORKOUT_STACK[appState.currentIndex].rotationCode,
          clearedAt: new Date().toISOString()
        });
        appState.currentIndex++;
        saveState(appState);
        renderCard();
      }, 250);
    }

    function undoLastClear() {
      if (appState.currentIndex > 0) {
        appState.currentIndex--;
        appState.clearedHistory.pop();
        saveState(appState);
        renderCard();
      }
    }

    function resetChallenge() {
      if (confirm("Reset the 100-day stack? This will clear all progress and start back at Session 1.")) {
        appState = { currentIndex: 0, clearedHistory: [] };
        saveState(appState);
        renderCard();
      }
    }

    const modal = document.getElementById("primerModal");
    const primerContent = document.getElementById("primerContent");
    primerContent.innerHTML = window.PRE_GAME_PRIMER.map(p => `
      <div class="primer-step">
        <div class="primer-step-title">${p.minute}: ${p.title}</div>
        <div class="primer-step-desc">${p.desc}</div>
      </div>
    `).join("");

    document.getElementById("openPrimerBtn").onclick = () => modal.style.display = "flex";
    document.getElementById("closePrimerBtn").onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

    document.getElementById("undoBtn").addEventListener("click", undoLastClear);
    document.getElementById("resetBtn").addEventListener("click", resetChallenge);

    renderCard();
  </script>
</body>
</html>
