<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100-Day Bilateral Workout Stack</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --phase-tag: #818cf8;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem 1rem;
    }

    header { text-align: center; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }

    .canvas-container { position: relative; margin: 0.5rem 0 1rem 0; }
    canvas { display: block; background: transparent; }

    .stack-wrapper { position: relative; width: 100%; max-width: 500px; }
    .stack-layer {
      position: absolute; left: 0; right: 0; height: 100%; border-radius: 1.25rem;
      background-color: #141f33; border: 1px solid #233148; transition: all 0.3s ease; z-index: 1;
    }
    .layer-2 { top: 12px; transform: scale(0.92); opacity: 0.4; }
    .layer-1 { top: 6px; transform: scale(0.96); opacity: 0.7; }

    .workout-card {
      position: relative; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 1.25rem; padding: 1.4rem; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.6);
      z-index: 2; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }
    .workout-card.cleared { transform: translateY(-40px) scale(0.95); opacity: 0; }

    .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .badges-left { display: flex; gap: 0.4rem; align-items: center; }
    .day-badge {
      background: var(--accent-glow); color: var(--accent); font-weight: 700; font-size: 0.85rem;
      padding: 0.25rem 0.65rem; border-radius: 9999px; border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .phase-badge {
      background: rgba(129, 140, 248, 0.15); color: var(--phase-tag); font-size: 0.75rem;
      font-weight: 600; padding: 0.25rem 0.55rem; border-radius: 9999px; border: 1px solid rgba(129, 140, 248, 0.3);
    }
    .rotation-tag { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .workout-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.35rem; line-height: 1.25; }
    .workout-description { font-size: 0.88rem; color: var(--text-muted); font-style: italic; line-height: 1.45; margin-bottom: 1.2rem; }

    .exercise-list { list-style: none; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.65rem; }
    
    .exercise-item {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .thumb-link {
      display: block;
      width: 52px;
      height: 52px;
      border-radius: 0.5rem;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .exercise-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0f172a;
      transition: transform 0.2s;
    }
    .thumb-link:hover .exercise-thumb {
      transform: scale(1.08);
    }

    .exercise-body {
      flex-grow: 1;
      min-width: 0;
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.2rem;
      gap: 0.5rem;
    }

    .exercise-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exercise-protocol {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .exercise-cue {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
      margin-bottom: 0.3rem;
    }

    .video-link {
      font-size: 0.72rem;
      color: #38bdf8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 600;
    }
    .video-link:hover {
      text-decoration: underline;
    }

    .action-btn {
      width: 100%; background: var(--success); color: #052e16; border: none; padding: 0.9rem 1.25rem;
      font-size: 1rem; font-weight: 700; border-radius: 0.75rem; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 0.5rem; transition: filter 0.2s, transform 0.1s;
    }
    .action-btn:hover { filter: brightness(1.1); }
    .action-btn:active { transform: scale(0.98); }

    .footer-controls { display: flex; justify-content: space-between; margin-top: 1.25rem; max-width: 500px; width: 100%; padding: 0 0.5rem; }
    .secondary-btn {
      background: transparent; border: 1px solid #334155; color: var(--text-muted); padding: 0.4rem 0.8rem;
      border-radius: 0.5rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .secondary-btn:hover { border-color: #64748b; color: var(--text-main); }

    .secondary-btn:disabled { opacity: 0.4; cursor: default; border-color: #334155; color: var(--text-muted); }

    .all-done { text-align: center; padding: 2.5rem 1.5rem; }
    .all-done h2 { font-size: 1.6rem; color: var(--success); margin-bottom: 0.5rem; }
    .all-done p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <header>
    <h1>100-Day Bilateral Stack</h1>
  </header>

  <div class="canvas-container">
    <canvas id="progressCanvas" width="240" height="115"></canvas>
  </div>

  <div class="stack-wrapper">
    <div class="stack-layer layer-2" id="layer2"></div>
    <div class="stack-layer layer-1" id="layer1"></div>
    <main class="workout-card" id="activeCard"></main>
  </div>

  <div class="footer-controls">
    <button class="secondary-btn" id="undoBtn">↩ Undo Last Clear</button>
    <button class="secondary-btn" id="resetBtn">↻ Reset All</button>
  </div>

  <script src="workouts.js"></script>
  <script>
    const STORAGE_KEY = "bilateral_100_stack_state";
    const STACK = window.WORKOUT_STACK;
    const TOTAL = STACK.length;

    function freshState() {
      return { currentIndex: 0, clearedHistory: [] };
    }

    function loadState() {
      try {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (state && Number.isInteger(state.currentIndex)) {
          state.currentIndex = Math.min(Math.max(state.currentIndex, 0), TOTAL);
          state.clearedHistory = Array.isArray(state.clearedHistory) ? state.clearedHistory : [];
          return state;
        }
      } catch (e) {}
      return freshState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    let appState = loadState();

    const canvas = document.getElementById("progressCanvas");
    const ctx = canvas.getContext("2d");
    const cardEl = document.getElementById("activeCard");
    const layer1 = document.getElementById("layer1");
    const layer2 = document.getElementById("layer2");
    const undoBtn = document.getElementById("undoBtn");

    function drawArc(cx, cy, radius, endAngle, color) {
      ctx.beginPath();
      ctx.arc(cx, cy, radius, Math.PI, endAngle, false);
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    function renderCanvasProgress() {
      const w = canvas.width, h = canvas.height;
      const current = appState.currentIndex;
      const percent = Math.min(100, Math.round((current / TOTAL) * 100));
      const cx = w / 2, cy = h - 15, radius = 70;

      ctx.clearRect(0, 0, w, h);
      drawArc(cx, cy, radius, 2 * Math.PI, "#1e293b");
      if (percent > 0) drawArc(cx, cy, radius, Math.PI * (1 + percent / 100), "#38bdf8");

      ctx.textAlign = "center";
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.fillText(`${percent}%`, cx, cy - 20);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px -apple-system, sans-serif";
      ctx.fillText(`${current} of ${TOTAL} Cleared`, cx, cy - 4);
    }

    function exerciseHTML(ex) {
      const link = `target="_blank" rel="noopener noreferrer"`;
      const thumb = ex.thumb
        ? `<a href="${ex.videoUrl || '#'}" ${link} class="thumb-link" title="Watch demonstration">
             <img src="${ex.thumb}" alt="${ex.name}" class="exercise-thumb" loading="lazy" onerror="this.style.display='none'">
           </a>`
        : "";
      const video = ex.videoUrl
        ? `<a href="${ex.videoUrl}" ${link} class="video-link">▶ Video Demo ↗</a>`
        : "";

      return `
        <li class="exercise-item">
          ${thumb}
          <div class="exercise-body">
            <div class="exercise-header">
              <span class="exercise-name" title="${ex.name}">${ex.name}</span>
              <span class="exercise-protocol">${ex.protocol}</span>
            </div>
            <div class="exercise-cue">${ex.cue}</div>
            ${video}
          </div>
        </li>`;
    }

    function render() {
      const idx = appState.currentIndex;
      const remaining = TOTAL - idx;

      layer1.style.display = remaining > 1 ? "block" : "none";
      layer2.style.display = remaining > 2 ? "block" : "none";
      undoBtn.disabled = idx === 0;
      cardEl.className = "workout-card";
      renderCanvasProgress();

      if (remaining <= 0) {
        cardEl.innerHTML = `
          <div class="all-done">
            <h2>🎉 ${TOTAL} Sessions Conquered!</h2>
            <p>You have completed the entire ${TOTAL}-session bilateral mobility, snowboard specificity, and alpine endurance program!</p>
            <button class="action-btn" id="restartBtn">Restart Challenge</button>
          </div>`;
        document.getElementById("restartBtn").addEventListener("click", resetChallenge);
        return;
      }

      const workout = STACK[idx];
      cardEl.innerHTML = `
        <div class="card-meta">
          <div class="badges-left">
            <span class="day-badge">Session ${workout.day} / ${TOTAL}</span>
            <span class="phase-badge">${workout.phase}</span>
          </div>
          <span class="rotation-tag">${workout.rotationCode}</span>
        </div>
        <h2 class="workout-title">${workout.title}</h2>
        <p class="workout-description">${workout.description}</p>
        <ul class="exercise-list">${workout.exercises.map(exerciseHTML).join("")}</ul>
        <button class="action-btn" id="clearBtn">✓ Clear Session ${workout.day} & Next</button>`;
      document.getElementById("clearBtn").addEventListener("click", clearCurrentWorkout);
    }

    function clearCurrentWorkout(e) {
      e.currentTarget.disabled = true; // prevent double-clears during the animation
      cardEl.classList.add("cleared");

      setTimeout(() => {
        const workout = STACK[appState.currentIndex];
        appState.clearedHistory.push({
          day: workout.day,
          rotation: workout.rotationCode,
          clearedAt: new Date().toISOString()
        });
        appState.currentIndex++;
        saveState();
        render();
      }, 250);
    }

    function undoLastClear() {
      if (appState.currentIndex === 0) return;
      appState.currentIndex--;
      appState.clearedHistory.pop();
      saveState();
      render();
    }

    function resetChallenge() {
      if (!confirm(`Reset the ${TOTAL}-day stack? This will clear all progress and start back at Session 1.`)) return;
      appState = freshState();
      saveState();
      render();
    }

    undoBtn.addEventListener("click", undoLastClear);
    document.getElementById("resetBtn").addEventListener("click", resetChallenge);

    render();
  </script>
</body>
</html>
